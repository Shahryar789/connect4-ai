[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connect4-ai"
version = "0.1.0"
description = "Connect Four AI demonstrating minimax and alpha-beta pruning"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/connect4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
